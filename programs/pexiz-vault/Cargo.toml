[package]
name = "pexiz_vault"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"

[lib]
crate-type = ["cdylib", "lib"]
name = "pexiz_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "pexiz_oracle/idl-build", "canary_venue/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["token"] }
pexiz_oracle = { path = "../pexiz-oracle", features = ["cpi"] }
canary_venue = { path = "../canary-venue", features = ["cpi"] }

[dev-dependencies]
proptest = "1"
