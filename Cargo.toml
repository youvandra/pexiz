[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# The exit program goes to devnet as a new deploy; built for size.
[profile.release.package.pexiz_exit]
opt-level = "z"
